<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10284a">
  <title>生き物記録帳</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.svg">
  <link rel="stylesheet" href="./guide.css">
  <script type="module" src="./guide.mjs"></script>
</head>
<body>
  <header class="masthead">
    <div class="frame"><span class="brand">生き物記録帳</span><button id="backup-open" type="button">データ管理</button></div>
  </header>
  <main class="frame">
    <p id="status" role="status" hidden></p>
    <section id="guide" aria-labelledby="guide-title">
      <div class="section-head">
        <h1 id="guide-title">わたしの図鑑</h1>
        <button id="taxonomy-open" class="secondary" type="button">分類を一括取得</button>
      </div>
      <label class="sr-only" for="search">和名で検索</label>
      <input id="search" type="search" placeholder="和名で検索">
      <details id="filter-panel">
        <summary>絞り込み</summary>
        <div id="filters" class="fields"></div>
      </details>
      <p class="result-count" id="count" aria-live="polite"></p>
      <div class="cards" id="cards"></div>
      <button id="more" type="button" hidden>もっと見る</button>
    </section>
    <section id="facilities" aria-labelledby="facilities-title" hidden>
      <h1 id="facilities-title">訪問履歴</h1>
      <div id="places" class="stack"></div>
    </section>
    <section id="register" aria-labelledby="register-title" hidden>
      <h1 id="register-title">観察を記録</h1>
      <form id="visit-form" class="panel">
        <div class="fields">
          <label>施設名<input required id="place" list="place-list"><datalist id="place-list"></datalist></label>
          <label>施設区分<select id="place-type" required><option value="">選択</option><option>動物園</option><option>水族館</option></select></label>
          <label>訪問日<input type="date" id="date" required></label>
          <label>訪問の備考 <small>任意</small><input id="visit-notes"></label>
        </div>
        <button type="submit" class="secondary">訪問だけ記録</button>
      </form>
      <div class="modes" role="group" aria-label="記録方法">
        <button type="button" data-mode="manual" aria-pressed="true">和名を入力</button>
        <button type="button" data-mode="signs" aria-pressed="false">看板を読み取る</button>
        <button type="button" data-mode="missed" aria-pressed="false">見られなかった</button>
      </div>
      <form id="manual" class="panel mode">
        <label>和名 <small>複数の場合は1行に1件</small><textarea id="names" required rows="3"></textarea></label>
        <label>観察の備考 <small>任意</small><input id="observation-notes"></label>
        <button type="submit">確認・分類取得</button>
      </form>
      <div id="signs" class="panel mode" hidden>
        <label>展示看板の写真 <small>複数選択可</small><input id="files" type="file" accept="image/*" multiple></label>
        <button id="scan" type="button">読み取り開始</button>
        <button id="cancel-scan" class="secondary" type="button" hidden>途中で止める</button>
        <progress id="progress" hidden></progress>
        <p id="scan-status" role="status" hidden></p>
      </div>
      <form id="missed" class="panel mode" hidden>
        <label>見られなかった生き物 <small>1行に1件</small><textarea id="missed-names" rows="3" required></textarea></label>
        <button type="submit">訪問に追加</button>
      </form>
      <section id="review" hidden aria-labelledby="review-title">
        <h2 id="review-title">登録する生き物を確認</h2>
        <p id="review-status" role="status"></p>
        <form id="review-form"><div id="review-list" class="stack"></div><button type="submit">まとめて登録</button></form>
      </section>
    </section>
    <section id="stats" aria-labelledby="stats-title" hidden>
      <h1 id="stats-title">コレクション</h1>
      <div id="statistics"></div>
    </section>
  </main>
  <nav class="bottom-nav" aria-label="メインメニュー">
    <button type="button" data-tab="guide" aria-current="page">図鑑</button>
    <button type="button" data-tab="facilities">訪問</button>
    <button type="button" data-tab="register">記録する</button>
    <button type="button" data-tab="stats">統計</button>
  </nav>
  <dialog id="detail"><div class="dialog-head"><button type="button" class="secondary" data-close>閉じる</button></div><div id="detail-content"></div></dialog>
  <dialog id="taxonomy" aria-labelledby="taxonomy-title">
    <div class="dialog-head"><button type="button" class="secondary" data-close>閉じる</button></div>
    <h2 id="taxonomy-title">登録済みの分類を一括取得</h2>
    <p>iNaturalistで和名を照合し、大分類・目・科・属の空欄を補います。取得した候補を確認してから保存できます。</p>
    <div class="inline">
      <button id="taxonomy-scan" type="button">分類を検索</button>
      <button id="taxonomy-stop" type="button" class="secondary" hidden>検索を停止</button>
    </div>
    <label class="inline"><input id="taxonomy-compare" type="checkbox">入力済みの分類もすべて照合する</label>
    <progress id="taxonomy-progress" aria-label="分類検索の進捗" hidden></progress>
    <p id="taxonomy-status" role="status"></p>
    <details id="taxonomy-issues" hidden>
      <summary id="taxonomy-issues-title"></summary>
      <ul id="taxonomy-issues-list" class="stack"></ul>
    </details>
    <details id="taxonomy-differences" hidden>
      <summary id="taxonomy-differences-title"></summary>
      <p>登録値と検索結果を表示します。分類名の別表記も含まれます。</p>
      <ul id="taxonomy-differences-list" class="stack"></ul>
    </details>
    <form id="taxonomy-form" hidden>
      <div class="inline"><button type="submit">選択した分類を保存</button></div>
      <div id="taxonomy-results" class="stack"></div>
    </form>
  </dialog>
  <dialog id="backup"><div class="dialog-head"><button type="button" class="secondary" data-close>閉じる</button></div>
    <h2>データ管理</h2>
    <p>現在の端末の記録と写真をJSONに保存します。</p>
    <button type="button" id="download">JSONを書き出す</button>
    <hr>
    <p>旧アプリのFirebaseから記録を読み込みます。読み込んだ記録はこの端末に保存されます。</p>
    <button type="button" id="legacy-cloud" class="secondary">Firebaseの旧記録を読み込む</button>
    <p id="backup-status" role="status"></p>
  </dialog>
</body>
</html>
